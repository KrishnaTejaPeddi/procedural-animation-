<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Walk Around + Creature Toolkit</title>
<style>
  :root { --panel: rgba(255,255,255,0.88); --text: #16303f; --btn: rgba(22,48,63,0.10); }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --panel: rgba(20,33,43,0.88); --text: #e6f1f7; --btn: rgba(230,241,247,0.14); }
  }
  :root[data-theme="dark"] { --panel: rgba(20,33,43,0.88); --text: #e6f1f7; --btn: rgba(230,241,247,0.14); }

  html, body { margin: 0; height: 100%; overflow: hidden; background: #9fd0ee; font: 14px/1.3 system-ui, sans-serif; }
  canvas { display: block; touch-action: none; cursor: grab; }

  #panel {
    position: fixed; top: calc(10px + env(safe-area-inset-top, 0px)); left: 10px;
    width: 230px; max-height: 80%; overflow-y: auto; box-sizing: border-box;
    background: var(--panel); color: var(--text); border-radius: 10px; padding: 10px 12px;
  }
  #panel summary { cursor: pointer; font-weight: 600; }
  #panel button {
    font: inherit; color: var(--text); background: var(--btn);
    border: 0; border-radius: 6px; padding: 6px 8px; cursor: pointer;
  }
  #viewBtn, #ctrlBtn { width: 100%; margin-top: 8px; }
  #presets { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 6px; }
  #panel h4 { margin: 14px 0 0; font-size: 13px; }
  #panel label.row { display: block; margin-top: 10px; }
  #panel label.row span { display: flex; justify-content: space-between; }
  #panel input[type=range] { width: 100%; margin: 4px 0 0; }
  #panel label.check { display: flex; gap: 8px; align-items: center; margin-top: 12px; }

  #hint {
    position: fixed; left: 0; right: 0; bottom: 0;
    padding: 12px 12px calc(12px + env(safe-area-inset-bottom, 0px));
    text-align: center; color: #0b3550; pointer-events: none;
  }
</style>
</head>
<body>

<details id="panel" open>
  <summary>Controls</summary>
  <button id="viewBtn"></button>
  <button id="ctrlBtn"></button>
  <div id="gaitInfo" style="margin-top:8px"></div>
  <h4>Terrain</h4>
  <div id="terrainBox"></div>
  <h4>Creature presets</h4>
  <div id="presets"></div>
  <h4>Build your own</h4>
  <div id="sliders"></div>
  <label class="check"><input type="checkbox" id="wander" checked> Creature wanders</label>
</details>
<div id="hint">V changes the view. C switches between controlling you and the creature. W A S D to move, Space to jump (you). Drag to look or orbit, scroll to zoom.</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// =====================================================================
// PART A: THE WORLD (scene, light, floor, boxes). Same as before, plus shadows.
// =====================================================================
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x9fd0ee);
scene.fog = new THREE.Fog(0x9fd0ee, 15, 45);

const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 100);
camera.rotation.order = 'YXZ';

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;       // shadows show where feet touch the ground
document.body.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0xffffff, 0.65));
const sun = new THREE.DirectionalLight(0xffffff, 0.7);
sun.position.set(10, 20, 5);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -35; sun.shadow.camera.right = 35;
sun.shadow.camera.top = 35;   sun.shadow.camera.bottom = -35;
sun.shadow.camera.near = 1;   sun.shadow.camera.far = 70;
sun.shadow.bias = -0.0008;
scene.add(sun);

// The floor is now a bumpy mesh. We make a flat grid of points here and
// lift each point to the terrain height further down (rebuildTerrain).
const terrainGeo = new THREE.PlaneGeometry(50, 50, 125, 125);
terrainGeo.rotateX(-Math.PI / 2);                  // lay it flat so x and z are floor coordinates
terrainGeo.setAttribute('color', new THREE.BufferAttribute(new Float32Array(terrainGeo.attributes.position.count * 3), 3));
const floor = new THREE.Mesh(terrainGeo, new THREE.MeshPhongMaterial({ vertexColors: true, flatShading: true, shininess: 0, specular: 0x000000 }));
floor.receiveShadow = true;
scene.add(floor);

const boxes = [];                        // remember every box so we can collide with it
function addBox(x, z, size, height, color) {
  boxes.push({ x, z, half: size / 2, height });
  const box = new THREE.Mesh(
    new THREE.BoxGeometry(size, height, size),
    new THREE.MeshLambertMaterial({ color })
  );
  box.position.set(x, height / 2, z);
  box.castShadow = true;
  box.receiveShadow = true;
  scene.add(box);
}
addBox(0, 0, 2, 2, 0xd23b3b);
addBox(-8, -6, 3, 5, 0x3b82d2);
addBox(7, -9, 2, 1, 0xe6b422);
addBox(4, -4, 2, 0.8, 0xe67e22);         // two steps you can jump up
addBox(6, -4, 2, 1.6, 0xe67e22);
addBox(10, 4, 4, 3, 0x8e5bd2);
addBox(-10, 8, 2, 2, 0xf2f2f2);

// ---- Terrain ----------------------------------------------------------
// terrainHeight(x, z) answers "how high is the ground here?".
// The player and every creature foot ask the world this question, so changing
// this one function changes the ground for everything.
let roughness = 1.0;                     // 0 = flat floor, bigger = taller, sharper terrain
const smooth01 = t => t * t * (3 - 2 * t);
// An even smoother ease than smooth01: speed AND acceleration are zero at both ends, so a motion
// that uses it starts and stops with no jolt at all.
const smoother = k => k * k * k * (k * (6 * k - 15) + 10);

// A critically damped spring. Instead of jumping to a new value, `x` glides toward its target.
// What makes it smooth is that it has a speed (v) of its own, and the speed changes gradually,
// so there are no sudden changes of direction or jolts. (Simple easing, like x += (target - x) * k,
// changes speed instantly whenever the target moves.)
//   omega: how stiff it is. Bigger = snappier (it settles in roughly 4 / omega seconds).
//   targetVel: how fast the target itself is moving, so the spring doesn't trail behind it.
class Spring {
  constructor(x = 0) { this.x = x; this.v = 0; }
  update(target, dt, omega, targetVel = 0) {
    const accel = omega * omega * (target - this.x) + 2 * omega * (targetVel - this.v);
    this.v += accel * dt;
    this.x += this.v * dt;
    return this.x;
  }
}

// "Value noise": a random height at every whole-number grid point, blended
// smoothly in between. Using a hash instead of Math.random keeps it the same every time.
function hash2(ix, iz) {
  let h = Math.imul(ix, 374761393) ^ Math.imul(iz, 668265263);
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}
function valueNoise(x, z) {
  const ix = Math.floor(x), iz = Math.floor(z);
  const fx = smooth01(x - ix), fz = smooth01(z - iz);
  const a = hash2(ix, iz), b = hash2(ix + 1, iz), c = hash2(ix, iz + 1), d = hash2(ix + 1, iz + 1);
  const top = a + (b - a) * fx, bottom = c + (d - c) * fx;
  return top + (bottom - top) * fz;
}

function terrainHeight(x, z) {
  // Three layers added together: big hills, sharp ridges, small bumps
  const big   = (valueNoise(x * 0.15, z * 0.15) - 0.5) * 2.4;
  const ridge = ((1 - Math.abs(2 * valueNoise(x * 0.3 + 40, z * 0.3 + 17) - 1)) - 0.5) * 1.0;   // folding the noise makes sharp creases
  const small = (valueNoise(x * 0.9 + 9, z * 0.9 + 71) - 0.5) * 0.3;
  const h = (big + ridge + small) * roughness;

  // Flatten the ground near the boxes and your starting spot
  let flat = 1;
  for (const b of boxes) {
    const d = Math.max(Math.abs(x - b.x), Math.abs(z - b.z)) - b.half;
    flat *= smooth01(Math.max(0, Math.min(1, (d - 0.5) / 3)));
  }
  flat *= smooth01(Math.max(0, Math.min(1, (Math.hypot(x, z - 8) - 2) / 4)));
  return h * flat;
}

// What creatures stand on: the terrain, or the top of a box if there is one here.
// (You, the player, treat boxes separately: you jump up onto them.)
const world = {
  // maxBox: ignore boxes taller than this (a creature that can't climb a box treats it as a wall, not ground)
  groundHeight(x, z, maxBox = Infinity) {
    let g = terrainHeight(x, z);
    for (const b of boxes) {
      if (b.height > maxBox) continue;
      if (Math.abs(x - b.x) <= b.half && Math.abs(z - b.z) <= b.half && b.height > g) g = b.height;
    }
    return g;
  }
};

// Move every point of the floor mesh to its terrain height, and color it by height
function rebuildTerrain() {
  const pos = terrainGeo.attributes.position, col = terrainGeo.attributes.color;
  for (let i = 0; i < pos.count; i++) {
    const y = terrainHeight(pos.getX(i), pos.getZ(i));
    pos.setY(i, y);
    const t = Math.max(0, Math.min(1, (y + 1.5) / 3));
    col.setXYZ(i, 0.28 + 0.45 * t, 0.46 + 0.34 * t, 0.30 + 0.22 * t);
  }
  pos.needsUpdate = true;
  col.needsUpdate = true;
  terrainGeo.computeVertexNormals();
  terrainGeo.computeBoundingSphere();
}
rebuildTerrain();

// =====================================================================
// PART B: THE PLAYER (walking, collision, jumping) and the CAMERA VIEWS
// =====================================================================
const player = { x: 0, z: 8 };           // where you stand on the floor
let yaw = 0, pitch = 0;                  // which way you look
const EYE = 1.7;
const RADIUS = 0.4;
const GRAVITY = 20;
const JUMP_SPEED = 7;
let feetY = 0, velY = 0, onGround = true;

function overlaps(b, px, pz) {
  return Math.abs(px - b.x) < b.half + RADIUS && Math.abs(pz - b.z) < b.half + RADIUS;
}
function blocked(px, pz) {
  return boxes.some(b => overlaps(b, px, pz) && feetY < b.height - 0.05);
}
function groundAt(px, pz, fromY) {
  let g = terrainHeight(px, pz);          // bare terrain always holds you up; boxes are checked below
  for (const b of boxes) {
    if (overlaps(b, px, pz) && b.height <= fromY + 0.05) g = Math.max(g, b.height);
  }
  return g;
}

// A simple stand-in body so you can see yourself in third person
const avatar = new THREE.Group();
(function buildAvatar() {
  const mat = new THREE.MeshLambertMaterial({ color: 0x3b82d2 });
  const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.28, 0.28, 1.1, 16), mat);
  trunk.position.y = 0.65;
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.25, 16, 12), new THREE.MeshLambertMaterial({ color: 0xf2d2b0 }));
  head.position.y = 1.4;
  const nose = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.12, 0.2), new THREE.MeshLambertMaterial({ color: 0xd23b3b }));
  nose.position.set(0, 1.4, -0.28);      // sticks out the front so you can tell which way you face
  for (const m of [trunk, head, nose]) { m.castShadow = true; avatar.add(m); }
})();
scene.add(avatar);

// --- Camera views: first person, third person (behind you), observe the creature
const CAM_ORDER = ['first', 'third', 'observe'];
const CAM_NAMES = { first: 'First person', third: 'Third person', observe: 'Observe creature' };
let camMode = 'observe';
let thirdDist = 5;                       // how far behind you in third person
let orbitYaw = 0.6, orbitPitch = 0.45, orbitDist = 9;   // observe view settings
const obsTarget = new THREE.Vector3(-4, 1, 12);
const camSpring = { x: new Spring(-4), y: new Spring(1), z: new Spring(12) };         // what the observe camera looks at
const viewBtn = document.getElementById('viewBtn');

function setCamMode(mode) {
  camMode = mode;
  viewBtn.textContent = 'View: ' + CAM_NAMES[mode] + ' (V)';
  avatar.visible = mode !== 'first';     // hide your own body in first person
}
viewBtn.addEventListener('click', () => {
  setCamMode(CAM_ORDER[(CAM_ORDER.indexOf(camMode) + 1) % CAM_ORDER.length]);
  viewBtn.blur();
});

// --- Who do the keys control: you, or the creature?
let controlCreature = false;
const ctrlBtn = document.getElementById('ctrlBtn');
function setControl(on) {
  controlCreature = on;
  ctrlBtn.textContent = 'Controlling: ' + (on ? 'Creature' : 'You') + ' (C)';
  if (on) { document.getElementById('wander').checked = false; setCamMode('observe'); }         // so you can watch what you're driving
}
ctrlBtn.addEventListener('click', () => { setControl(!controlCreature); ctrlBtn.blur(); });

// --- Input
const keys = {};
window.addEventListener('keydown', e => {
  keys[e.code] = true;
  if (e.code === 'Space' || e.code.startsWith('Arrow')) e.preventDefault();
  if (e.code === 'KeyV' && !e.repeat) viewBtn.click();
  if (e.code === 'KeyC' && !e.repeat) ctrlBtn.click();
});
window.addEventListener('keyup', e => { keys[e.code] = false; });

let dragging = false, lastX = 0, lastY = 0;
renderer.domElement.addEventListener('pointerdown', e => { dragging = true; lastX = e.clientX; lastY = e.clientY; });
window.addEventListener('pointerup', () => { dragging = false; });
window.addEventListener('pointermove', e => {
  if (!dragging) return;
  const dx = e.clientX - lastX, dy = e.clientY - lastY;
  if (camMode === 'observe') {           // dragging orbits around the creature
    orbitYaw -= dx * 0.006;
    orbitPitch = Math.max(0.05, Math.min(1.4, orbitPitch + dy * 0.006));
  } else {                               // dragging turns where you look
    yaw -= dx * 0.004;
    pitch = Math.max(-1.3, Math.min(1.3, pitch - dy * 0.004));
  }
  lastX = e.clientX; lastY = e.clientY;
});
window.addEventListener('wheel', e => {
  if (camMode === 'third') thirdDist = Math.max(2, Math.min(12, thirdDist + e.deltaY * 0.01));
  if (camMode === 'observe') orbitDist = Math.max(4, Math.min(30, orbitDist + e.deltaY * 0.015));
});
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// Which way is "forward" on screen? In observe view it is away from the camera.
function viewHeading() { return (camMode === 'observe') ? orbitYaw : yaw; }

// Read W A S D / arrow keys as a direction on the floor, relative to the view.
// Both you and the creature use this.
const moveInput = { x: 0, z: 0 };
function readMoveInput(heading) {
  const forwardX = -Math.sin(heading), forwardZ = -Math.cos(heading);
  const rightX = Math.cos(heading), rightZ = -Math.sin(heading);
  let x = 0, z = 0;
  if (keys['KeyW'] || keys['ArrowUp'])    { x += forwardX; z += forwardZ; }
  if (keys['KeyS'] || keys['ArrowDown'])  { x -= forwardX; z -= forwardZ; }
  if (keys['KeyD'] || keys['ArrowRight']) { x += rightX;   z += rightZ; }
  if (keys['KeyA'] || keys['ArrowLeft'])  { x -= rightX;   z -= rightZ; }
  moveInput.x = x; moveInput.z = z;
  return moveInput;
}

const SPEED = 5;
const LIMIT = 24;
const playerVel = { x: new Spring(0), z: new Spring(0) };   // your horizontal speed, smoothed

function updatePlayer(dt) {
  const heading = viewHeading();
  let moveX = 0, moveZ = 0;
  if (!controlCreature) {                // while you control the creature, you stand still
    const m = readMoveInput(heading);
    moveX = m.x; moveZ = m.z;
  }

  // Move one direction at a time, so you slide along walls instead of sticking
  // Your speed is a spring too: it builds up and dies away over a fraction of a second instead of
  // jumping straight to full speed, so starting and stopping feel smooth.
  const vx = playerVel.x.update(moveX * SPEED, dt, 14), vz = playerVel.z.update(moveZ * SPEED, dt, 14);
  const newX = Math.max(-LIMIT, Math.min(LIMIT, player.x + vx * dt));
  if (!blocked(newX, player.z)) player.x = newX; else { playerVel.x.x = 0; playerVel.x.v = 0; }
  const newZ = Math.max(-LIMIT, Math.min(LIMIT, player.z + vz * dt));
  if (!blocked(player.x, newZ)) player.z = newZ; else { playerVel.z.x = 0; playerVel.z.v = 0; }

  // Jumping and gravity
  if (keys['Space'] && onGround && !controlCreature) velY = JUMP_SPEED;
  const prevFeet = feetY;
  const wasOnGround = onGround;
  velY -= GRAVITY * dt;
  feetY += velY * dt;
  const ground = groundAt(player.x, player.z, prevFeet);
  onGround = false;
  // Land on the ground. If you were already standing and the ground drops a
  // little, stick to it so you walk down slopes instead of hopping.
  if (feetY <= ground || (wasOnGround && feetY - ground < 0.35)) { feetY = ground; velY = 0; onGround = true; }

  avatar.position.set(player.x, feetY, player.z);
  avatar.rotation.y = heading;
}

const camGoal = new THREE.Vector3();
const camLook = new THREE.Vector3();
function placeCamera(dt) {
  if (camMode === 'first') {
    camera.position.set(player.x, feetY + EYE, player.z);
    camera.rotation.set(pitch, yaw, 0);
  } else if (camMode === 'third') {
    // Sit behind you, looking the way you look
    camLook.set(player.x, feetY + 1.3, player.z);
    const cp = Math.cos(pitch), sp = Math.sin(pitch);
    camera.position.set(
      camLook.x + Math.sin(yaw) * cp * thirdDist,
      Math.max(0.3, camLook.y - sp * thirdDist),
      camLook.z + Math.cos(yaw) * cp * thirdDist
    );
    camera.lookAt(camLook);
  } else {
    // Orbit the creature. The target glides after it so the camera stays smooth.
    camGoal.set(creature.pos.x, creature.bodyY * 0.7, creature.pos.z);
    // Spring the camera target after the creature (the spring knows the creature's speed, so it doesn't trail)
    obsTarget.set(
      camSpring.x.update(camGoal.x, dt, 5, Math.sin(creature.goalYaw) * creature.speed),
      camSpring.y.update(camGoal.y, dt, 5),
      camSpring.z.update(camGoal.z, dt, 5, Math.cos(creature.goalYaw) * creature.speed));
    const cp = Math.cos(orbitPitch);
    camera.position.set(
      obsTarget.x + Math.sin(orbitYaw) * cp * orbitDist,
      obsTarget.y + Math.sin(orbitPitch) * orbitDist,
      obsTarget.z + Math.cos(orbitYaw) * cp * orbitDist
    );
    camera.lookAt(obsTarget);
  }
}

// =====================================================================
// PART C: THE CREATURE TOOLKIT
// ---------------------------------------------------------------------
// Three pieces, designed to be reused for any creature:
//   1. A creature "spec": plain data describing a body and a list of legs.
//      Legs can be anywhere on the body, any length, any count.
//   2. findNeighbors(): looks at where the legs are and works out which legs
//      must not lift at the same time. This is what produces the gait.
//   3. class Creature: builds the shapes from a spec and does the walking.
//
// A hand-written spec looks like this:
//   { body: { length: 2, width: 1, height: 1 },
//     legs: [ { hipX: 0.5, hipZ: 0.8, length: 2, thickness: 0.1, footSize: 0.25 }, ... ] }
//   hipX: which side of the body (positive = left, negative = right). The creature
//         attaches the leg to the body edge by itself, so legs never float away.
//   hipZ: how far along the body (positive = front)
// =====================================================================

// Shapes shared by every creature
const UP = new THREE.Vector3(0, 1, 0);
const cylGeo = new THREE.CylinderGeometry(1, 1, 1, 12);   // a unit cylinder we stretch into limbs
const sphGeo = new THREE.SphereGeometry(1, 20, 14);       // a unit sphere we squash into body, knees, feet
const matLeg  = new THREE.MeshLambertMaterial({ color: 0x5b4a42 });
const matFoot = new THREE.MeshLambertMaterial({ color: 0x2a2420 });

function makeMesh(geo, mat, parent) {
  const m = new THREE.Mesh(geo, mat);
  m.castShadow = true;
  parent.add(m);
  return m;
}

// ---- Gait: which legs are neighbors? ---------------------------------
// Rule: a leg may only lift when none of its neighbors are in the air.
// Neighbors are found from the hip positions, so it works for any layout:
//   - the nearest leg on the other side of the body
//   - the next leg in front and the next leg behind, on the same side
// This one rule gives a different walk for each body automatically:
//   2 legs: left and right take turns (walking)
//   4 legs: diagonal pairs move together (trotting)
//   6 legs: alternating groups of three (insect tripod)
//   8 legs: a rippling wave
function findNeighbors(legs) {
  for (const l of legs) l.neighbors = [];
  const link = (a, b) => {
    if (a && b && a !== b && !a.neighbors.includes(b)) { a.neighbors.push(b); b.neighbors.push(a); }
  };
  for (const a of legs) {
    let ahead = null, behind = null, across = null;
    for (const b of legs) {
      if (b === a) continue;
      if (b.side === a.side) {
        if (b.hipZ > a.hipZ && (!ahead || b.hipZ < ahead.hipZ)) ahead = b;
        if (b.hipZ < a.hipZ && (!behind || b.hipZ > behind.hipZ)) behind = b;
        if (b.hipZ === a.hipZ) link(a, b);
      } else {
        const d = Math.hypot(b.hipX - a.hipX, b.hipZ - a.hipZ);
        if (!across || d < across.d) across = { leg: b, d };
      }
    }
    link(a, ahead);
    link(a, behind);
    if (across) link(a, across.leg);
  }
}

// Spots around the body where we check the ground. Each one is
// [x, z, depth, hard, extra]:
//   x and z place the spot: a fraction of the body's half-width and half-length,
//   extra is extra distance beyond the body's edge (for spots outside it),
//   depth is how deep the body's curved underside goes at that spot (1 = deepest),
//   hard = true for spots under the body: the body must never sink below the ground there,
//   hard = false for spots just ahead of the body: they only make it start rising early.
const BODY_SAMPLES = [];
for (let i = -5; i <= 5; i++) {
  for (let j = -5; j <= 5; j++) {
    const nx = i / 5, nz = j / 5, r2 = nx * nx + nz * nz;
    if (r2 < 1) BODY_SAMPLES.push([nx, nz, Math.sqrt(1 - r2), true, 0]);
  }
}
for (const [extra, depth] of [[0.4, 0.9], [0.9, 0.6], [1.5, 0.35]]) {
  for (let k = 0; k < 16; k++) {
    const a = (k / 16) * Math.PI * 2;
    BODY_SAMPLES.push([Math.cos(a), Math.sin(a), depth, false, extra]);
  }
}

const AXIS_Z = new THREE.Vector3(0, 0, 1);
const KNEE_MAX_ACCEL = 400;     // how fast a knee's speed may change (units per second per second)

// A body is a row of ellipsoid segments, listed from the front to the rear (a head, a thorax, an abdomen...).
// A simple body is just one segment. Each segment is { length, width, height }, plus legs: true if
// legs are meant to grow from it. This works out where each one sits along the body, with a small
// overlap so neighbors look joined, and centers the whole row.
function layoutBodyParts(body) {
  const src = body.segments && body.segments.length ? body.segments
    : [{ length: body.length, width: body.width, height: body.height, legs: true }];
  const parts = src.map(s => ({ length: s.length, width: s.width, height: s.height, y: s.y || 0, legs: !!s.legs, zc: 0 }));
  for (let i = 1; i < parts.length; i++) {
    const a = parts[i - 1], b = parts[i];
    const overlap = 0.4 * Math.min(a.length, b.length);
    b.zc = a.zc - ((a.length + b.length) / 2 - overlap);          // each segment sits behind the one before it
  }
  const front = parts[0].zc + parts[0].length / 2;
  const rear = parts[parts.length - 1].zc - parts[parts.length - 1].length / 2;
  const mid = (front + rear) / 2;
  for (const p of parts) p.zc -= mid;                              // center the row on the body's middle
  return { parts, length: front - rear, width: Math.max(...parts.map(p => p.width)), height: Math.max(...parts.map(p => p.height)) };
}

// How close do two line segments (p1-q1 and p2-q2) get? Fills in res with the
// distance, where along each segment the closest points are (s and t, from 0 to 1),
// and dir, the direction from the second segment's closest point to the first's.
const _d1 = new THREE.Vector3(), _d2 = new THREE.Vector3(), _r = new THREE.Vector3();
const _c1 = new THREE.Vector3(), _c2 = new THREE.Vector3();
const clamp01 = v => Math.max(0, Math.min(1, v));
const wrapAngle = a => Math.atan2(Math.sin(a), Math.cos(a));   // an angle difference, wrapped into -180..180 degrees
function segSegClosest(p1, q1, p2, q2, res) {
  _d1.subVectors(q1, p1); _d2.subVectors(q2, p2); _r.subVectors(p1, p2);
  const a = _d1.dot(_d1), e = _d2.dot(_d2), f = _d2.dot(_r);
  let s = 0, t = 0;
  if (a > 1e-9 && e > 1e-9) {
    const c = _d1.dot(_r), b = _d1.dot(_d2), denom = a * e - b * b;
    s = denom > 1e-9 ? clamp01((b * f - c * e) / denom) : 0;
    t = (b * s + f) / e;
    if (t < 0) { t = 0; s = clamp01(-c / a); }
    else if (t > 1) { t = 1; s = clamp01((b - c) / a); }
  }
  _c1.copy(p1).addScaledVector(_d1, s);
  _c2.copy(p2).addScaledVector(_d2, t);
  res.s = s; res.t = t;
  res.dir.subVectors(_c1, _c2);
  res.dist = res.dir.length();
  return res;
}

// ---- The creature itself ---------------------------------------------
class Creature {
  constructor(spec, world, x, z, yaw) {
    this.spec = spec;
    this.world = world;
    this.gait = Object.assign(
      // stepTime: seconds a foot spends in the air
      // stepHeight: how high feet lift (fraction of leg length)
      // trigger: how far a foot may lag behind its resting spot before it steps (fraction of leg length)
      // tilt: how much the body leans to match the ground (0 to 1)
      // speed: walking speed multiplier
      // flex: how much the end segments of the body swing as it walks and turns (0 = stiff)
      { stepTime: 0.28, stepHeight: 0.18, trigger: 0.28, tilt: 0.8, speed: 1, flex: 0.6 },
      spec.gait
    );

    this.pos = new THREE.Vector3(x, 0, z);   // x/z on the floor
    this.yaw = yaw;                          // which way it faces (0 = toward +z)
    // The creature has two poses. The controller steers an invisible DRIVER (goalPos, goalYaw): where it
    // wants to be. The visible body (pos, yaw) is NOT moved directly. It is placed from where the feet are,
    // so the legs decide how the body actually moves. The driver waits if the body can't keep up.
    this.goalPos = this.pos.clone();
    this.goalYaw = yaw;
    this._yawRate = 0;                       // how fast the driver is turning right now
    // Everything that is smoothed is a spring (see Spring above), so it never changes speed suddenly
    this._sp = new Spring(0);                // forward speed
    this._yr = new Spring(0);                // turning speed
    this._pace = new Spring(1);              // how much the driver is holding back for the feet
    this._px = new Spring(x); this._pz = new Spring(z);   // body position
    this._yawS = new Spring(yaw);            // body direction
    this._tA = new Spring(0); this._tB = new Spring(0);   // body tilt (sideways, front to back)
    this._bk = new Spring(0);                // leaning into turns and weight shift
    this.speed = 0;                          // current forward speed
    this.fwd = 0;                            // what the controller wants: -1 to 1 (back/forward)
    this.turn = 0;                           // what the controller wants: -1 to 1 (right/left)

    // How the body is leaning: tiltA/tiltB match the slope of the ground, bank leans into turns
    this.tiltA = 0; this.tiltB = 0; this.bank = 0;
    this.q = new THREE.Quaternion();         // the body's full rotation
    this._qTilt = new THREE.Quaternion();
    this._qBank = new THREE.Quaternion();
    this._qFoot = new THREE.Quaternion();
    this._planeY = 0;                        // ground height under the body's center
    this._seg = { s: 0, t: 0, dist: 0, dir: new THREE.Vector3() };
    this._tmp = {
      ideal: new THREE.Vector3(), hip: new THREE.Vector3(), end: new THREE.Vector3(),
      dir: new THREE.Vector3(), pole: new THREE.Vector3(), knee: new THREE.Vector3(),
      v: new THREE.Vector3(), o: new THREE.Vector3(), p: new THREE.Vector3(), n: new THREE.Vector3(),
    };

    this.root = new THREE.Group();
    scene.add(this.root);

    // The body: a row of ellipsoid segments inside one group that we move and tilt as a whole
    const layout = layoutBodyParts(spec.body);
    this.parts = layout.parts;
    this.bodyLen = layout.length;                    // total length of the row
    this.bodyGroup = new THREE.Group();
    this.root.add(this.bodyGroup);
    this.bodyMats = [];
    this.parts.forEach((p, i) => {
      const color = new THREE.Color(spec.body.color || 0xc8553d).multiplyScalar(1 - 0.12 * i);   // a bit darker toward the rear
      const mat = new THREE.MeshLambertMaterial({ color });
      this.bodyMats.push(mat);
      p.mesh = makeMesh(sphGeo, mat, this.bodyGroup);
      p.mesh.matrixAutoUpdate = false;               // we set each segment's matrix ourselves (see _updateParts)
      p.mLocal = new THREE.Matrix4().compose(new THREE.Vector3(0, p.y, p.zc), new THREE.Quaternion(),
                                             new THREE.Vector3(p.width / 2, p.height / 2, p.length / 2));
      p.mRel = new THREE.Matrix4();                  // how this segment has swung, compared with resting in line
      p.yaw = 0; p.yawV = 0; p.pitch = 0; p.pitchV = 0;
    });
    this._m1 = new THREE.Matrix4(); this._m2 = new THREE.Matrix4();
    this._euler = new THREE.Euler(); this._qa = new THREE.Quaternion();

    this.legs = spec.legs.map(def => ({
      ...this._attachPoint(def),             // side (+1 left, -1 right) and hip position on the body
      length: def.length, thickness: def.thickness, footSize: def.footSize,
      upper: makeMesh(cylGeo, matLeg, this.root),
      lower: makeMesh(cylGeo, matLeg, this.root),
      knee:  makeMesh(sphGeo, matLeg, this.root),
      foot:  makeMesh(sphGeo, matFoot, this.root),
      hipJoint: makeMesh(sphGeo, matLeg, this.root),   // a round joint where the leg meets the body
      pos:  new THREE.Vector3(),             // where the foot is in the world
      from: new THREE.Vector3(),             // where the current step started
      to:   new THREE.Vector3(),             // where the current step will land
      stepping: false,                       // is the foot in the air?
      t: 0,                                  // how far through its step (0 to 1)
      stepDur: 0.3,                          // how long this step takes
      arc: 0,                                // how high this step lifts
      nrm: new THREE.Vector3(0, 1, 0),       // the slope the foot is resting on
      lx: 0, lz: 0,                          // foot position in the body's own frame
      poleS: new THREE.Vector3(0, 1, 0),     // smoothed knee direction (stops the knee flicking around)
      kneeBase: new THREE.Vector3(), kneeOff: new THREE.Vector3(),   // the knee before the keep-apart pass, and how far that pass moved it (carried to the next frame)
      kneePrev: new THREE.Vector3(), kneeVel: new THREE.Vector3(), kneeReady: false,   // for limiting how suddenly a knee can speed up
      reachMul: 1,                           // how far out this leg's foot rests (1 = normal)
      hipP: new THREE.Vector3(), kneeP: new THREE.Vector3(), endP: new THREE.Vector3(),   // the leg's three joints this frame
      neighbors: [],
    }));
    findNeighbors(this.legs);
    this._setupParts();

    // Numbers that depend on the body, so any creature shape just works
    const lengths = this.legs.map(l => l.length);
    this.avgLeg = lengths.reduce((a, b) => a + b, 0) / lengths.length;
    this.standHeight = Math.min(...lengths) * 0.6;   // how high the body rides above the ground
    this._buildGait();                               // work out this body's walking pattern (also sets maxSpeed)
    // Tallest box it can climb: while the body passes over, the legs must still reach the ground
    // on both sides. Longer legs climb higher; a thicker body climbs less.
    this.climbHeight = Math.max(0.2, Math.min(...lengths) * 0.8 - this.bodyH / 2 - 0.1);
    this.radius = 0.2 + Math.max(                    // how much floor space it needs
      this.bodyLen / 2,
      ...this.legs.map(l => Math.abs(l.hipX) + l.length * 0.45 + l.footSize)
    );

    // Start standing: every foot at its resting spot, body at the right height
    let avg = 0;
    for (const l of this.legs) {
      this._restFoot(l, this.pos.x, this.pos.z, this.yaw, 0, l.pos);
      avg += l.pos.y;
    }
    this.bodyY = avg / this.legs.length + this.standHeight;
    this._lastBodyY = this.bodyY;
    this._ys = new Spring(this.bodyY);        // body height
    this.q.setFromAxisAngle(UP, this.yaw);
    this.pace = 1;                           // slows down when the ground is too hard to keep up with
    this._strain = 0;
    this.settle();
  }

  // Let the creature drop into a comfortable standing pose (used when it is created or moved)
  settle() {
    const fwd = this.fwd, turn = this.turn;
    this.fwd = 0; this.turn = 0; this.speed = 0;
    for (let i = 0; i < 12; i++) this.update(0.05);
    this.fwd = fwd; this.turn = turn;
  }

  // Where on the body a leg attaches. We find the edge of the body (an
  // ellipse seen from above) at the leg's spot along the body, then tuck the
  // hip slightly inside it so the leg grows out of the body with no gap.
  _attachPoint(def) {
    const side = def.hipX >= 0 ? 1 : -1;
    // which segment is this hip on? the one whose middle is closest (counting in segment lengths)
    let part = 0, best = Infinity;
    const anyCarriers = this.parts.some(p => p.legs);           // if the body says which segments carry legs, only use those
    this.parts.forEach((p, i) => {
      if (anyCarriers && !p.legs) return;
      const d = Math.abs(def.hipZ - p.zc) / (p.length / 2);
      if (d < best) { best = d; part = i; }
    });
    const p = this.parts[part];
    const halfL = p.length / 2, halfW = p.width / 2;
    const along = Math.max(-0.9, Math.min(0.9, (def.hipZ - p.zc) / halfL));
    const hipZ = p.zc + along * halfL;
    const edge = halfW * Math.sqrt(1 - along * along);
    return { side, hipZ, hipX: side * edge * 0.85, part };
  }

  // The resting spot for a foot if the body were at (px, pz) facing `yaw`:
  // out to the side of its hip, a little ahead when moving, on the ground there.
  _restFoot(leg, px, pz, yaw, lead, out) {
    const s = Math.sin(yaw), c = Math.cos(yaw);
    const lx = leg.hipX + leg.side * leg.length * 0.45 * leg.reachMul;
    const lz = leg.hipZ + lead;
    out.x = px + lx * c + lz * s;
    out.z = pz - lx * s + lz * c;
    out.y = this.world.groundHeight(out.x, out.z);
    return out;
  }

  // Where is a hip in the world? It rides on the body, so it tilts with it.
  _hipWorld(l, out) {
    out.set(l.hipX, 0, l.hipZ).applyQuaternion(this.q);
    out.x += this.pos.x; out.y += this.bodyY; out.z += this.pos.z;
    return out;
  }

  // Move the whole creature somewhere else and let it settle into a standing pose
  teleport(x, z, yaw) {
    this.pos.set(x, 0, z); this.goalPos.set(x, 0, z);
    this.yaw = yaw; this.goalYaw = yaw;
    this.speed = 0; this._yawRate = 0;
    for (const s of [this._sp, this._yr, this._tA, this._tB, this._bk]) { s.x = 0; s.v = 0; }
    this._pace.x = 1; this._pace.v = 0;
    this._px.x = x; this._pz.x = z; this._yawS.x = yaw;
    for (const s of [this._px, this._pz, this._yawS]) s.v = 0;
    for (const l of this.legs) { l.stepping = false; l.armed = false; l.kneeReady = false; this._restFoot(l, x, z, yaw, 0, l.pos); }
    this.bodyY = this.world.groundHeight(x, z) + this.standHeight;
    this._ys.x = this.bodyY; this._ys.v = 0; this._lastBodyY = this.bodyY;
    this.q.setFromAxisAngle(UP, yaw);
    this.settle();
  }

  // ---- THE FEET PLACE THE BODY -----------------------------------------
  // This is the heart of it. Instead of moving the body and dragging the legs
  // along, we look at where the feet are and put the body there:
  //   - position: the middle of the feet
  //   - direction: the line from the left feet to the right feet, and from the rear feet
  //     to the front feet, tell us which way the body faces
  // So when the creature turns, the body can only rotate as far as the feet have
  // already stepped. The legs step around first, and the body follows them.
  _followFeet(dt) {
    const legs = this.legs, n = legs.length;
    let cx = 0, cz = 0, lx = 0, lz = 0, ln = 0, rx = 0, rz = 0, rn = 0;
    let fx = 0, fz = 0, fn = 0, bx = 0, bz = 0, bn = 0;
    for (const l of legs) {
      const f = l.pos;                                   // where the foot is right now (it moves smoothly, so the body does too)
      cx += f.x; cz += f.z;
      if (l.side > 0) { lx += f.x; lz += f.z; ln++; } else { rx += f.x; rz += f.z; rn++; }
      if (l.hipZ > this._meanHipZ + 1e-6) { fx += f.x; fz += f.z; fn++; }
      else if (l.hipZ < this._meanHipZ - 1e-6) { bx += f.x; bz += f.z; bn++; }
    }
    cx /= n; cz /= n;

    // Which way do the feet say the body faces? (Two clues: sideways line and front-to-back line)
    let dx = 0, dz = 0;
    if (ln && rn) {                                      // left feet minus right feet points to the body's left; turn that into "forward"
      const vx = lx / ln - rx / rn, vz = lz / ln - rz / rn;
      dx += -vz; dz += vx;
    }
    if (fn && bn) { dx += fx / fn - bx / bn; dz += fz / fn - bz / bn; }
    let feetYaw = this.goalYaw;
    if (dx * dx + dz * dz > 1e-6) feetYaw = Math.atan2(dx, dz);

    // Mostly trust the feet. (With only two legs the feet swing a lot with each step, so trust them a bit less.)
    const trust = this._gait.m > 1 ? 0.7 : 0.5;
    const targetYaw = this.yaw + wrapAngle(feetYaw - this.yaw) * trust + wrapAngle(this.goalYaw - this.yaw) * (1 - trust);
    // Ease toward it. Feet jump a little with every step, so we smooth that out: the body
    // follows the feet's overall direction, not each individual footfall.
    // (Easing alone makes the body lag behind the feet by speed / rate, which pushes every foot ahead of its
    // hip. So we also pass along most of the driver's turning speed, and let the feet correct any difference.)
    this.yaw = this._yawS.update(targetYaw, dt, 4, this._yawRate * 0.9);     // (the spring also knows how fast the driver turns, so it doesn't trail)

    // Where do the feet say the body is? Their middle, minus where the feet rest relative to the body.
    const s = Math.sin(this.yaw), c = Math.cos(this.yaw);
    const tx = cx - (this._restC.x * c + this._restC.z * s);
    const tz = cz - (-this._restC.x * s + this._restC.z * c);
    // keep up with the driver's speed, and let the feet correct the rest
    this.pos.x = this._px.update(tx, dt, 8, Math.sin(this.goalYaw) * this.speed);
    this.pos.z = this._pz.update(tz, dt, 8, Math.cos(this.goalYaw) * this.speed);
  }

  // ---- BODY SEGMENTS ---------------------------------------------------
  // Segments with legs on them are RIGID: they move with the body. The others (a head, an
  // abdomen, a tail) are LOOSE: each one hangs from its neighbor on a hinge, and swings on a
  // spring. They trail behind when the body turns, bob when it rises and falls, and wag a
  // little with the gait clock.
  _setupParts() {
    const parts = this.parts;
    for (const l of this.legs) parts[l.part].rigid = true;
    this.bodyH = Math.max(...parts.filter(p => p.rigid).map(p => p.height));
    parts.forEach((p, i) => {
      if (p.rigid) { p.parent = -1; p.depth = -1; return; }
      let nearest = -1, nearestDist = Infinity;                     // the closest rigid segment
      parts.forEach((q, j) => { if (q.rigid && Math.abs(i - j) < nearestDist) { nearestDist = Math.abs(i - j); nearest = j; } });
      p.parent = i + Math.sign(nearest - i);                        // the neighbor on the way toward it
      p.depth = nearestDist - 1;                                    // how many loose segments lie in between
      p.dir = Math.sign(i - nearest);                               // +1 in front of the body, -1 behind it
    });
    // The hinge sits where a loose segment overlaps its parent
    for (const p of parts) {
      if (p.rigid) continue;
      const par = parts[p.parent];
      const parentEdge = p.dir < 0 ? par.zc - par.length / 2 : par.zc + par.length / 2;
      const myEdge = p.dir < 0 ? p.zc + p.length / 2 : p.zc - p.length / 2;
      p.pivot = new THREE.Vector3(0, (p.y + par.y) / 2, (parentEdge + myEdge) / 2);
    }
    this._partOrder = parts.map((p, i) => i).sort((a, b) => parts[a].depth - parts[b].depth);   // parents before children
    this._lastYaw = this.yaw;
  }

  _updateParts(dt) {
    const parts = this.parts, flex = this.gait.flex;
    const step = Math.max(dt, 1e-4);
    const yawRate = wrapAngle(this.yaw - this._lastYaw) / step;     // how fast the body is turning
    const vy = (this.bodyY - this._lastBodyY) / step;               // how fast it is rising or falling
    this._lastYaw = this.yaw;
    this._lastBodyY = this.bodyY;
    const speedFrac = Math.min(1, Math.abs(this.speed) / this.maxSpeed);
    const wag = Math.PI * 2 * this.clock;

    for (const i of this._partOrder) {
      const p = parts[i];
      if (p.rigid) {
        p.mRel.identity();
      } else {
        // Where this segment "wants" to point. Rear segments trail outside a turn, front ones look into it.
        const turn = (p.dir < 0 ? 1 : 0.5) * yawRate * 0.25 * (1 + 0.4 * p.depth);
        const sway = -p.dir * Math.sin(wag + p.depth * 0.8) * 0.14 * speedFrac * (1 + 0.3 * p.depth);
        const yawGoal = Math.max(-0.6, Math.min(0.6, (turn + sway) * flex));
        const pitchGoal = Math.max(-0.35, Math.min(0.35, p.dir * vy * 0.1 * flex));   // lag behind up and down motion
        // A spring pulls it toward that angle, with some damping so it settles
        p.yawV += (60 * (yawGoal - p.yaw) - 10 * p.yawV) * dt;
        p.yaw += p.yawV * dt;
        p.pitchV += (60 * (pitchGoal - p.pitch) - 10 * p.pitchV) * dt;
        p.pitch += p.pitchV * dt;
        // Swing it about the hinge: move the hinge to the origin, rotate, move it back, then follow the parent
        this._euler.set(p.pitch, p.yaw, 0, 'YXZ');
        this._qa.setFromEuler(this._euler);
        this._m1.makeTranslation(p.pivot.x, p.pivot.y, p.pivot.z);
        this._m2.makeRotationFromQuaternion(this._qa);
        this._m1.multiply(this._m2);
        this._m2.makeTranslation(-p.pivot.x, -p.pivot.y, -p.pivot.z);
        this._m1.multiply(this._m2);
        p.mRel.multiplyMatrices(parts[p.parent].mRel, this._m1);
      }
      p.mesh.matrix.multiplyMatrices(p.mRel, p.mLocal);
      p.mesh.matrixWorldNeedsUpdate = true;
    }
  }

  // ---- BODY TILT -------------------------------------------------------
  // Fit a flat plane through the feet (least squares) and lean the body to
  // match it: nose up on an uphill, rolled sideways on a side slope.
  _updateOrientation(dt) {
    const legs = this.legs, T = this._tmp;
    const s = Math.sin(this.yaw), c = Math.cos(this.yaw);

    // Each foot (or where it will land, if it is in the air) in the body's own frame
    let mx = 0, mz = 0, my = 0;
    for (const l of legs) {
      // A foot in the air counts as the ground below it (not its lifted height), so the lean
      // doesn't jolt when a foot lifts off or lands.
      l.sy = l.stepping ? this.world.groundHeight(l.pos.x, l.pos.z) : l.pos.y;
      const dx = l.pos.x - this.pos.x, dz = l.pos.z - this.pos.z;
      l.lx = dx * c - dz * s;
      l.lz = dx * s + dz * c;
      mx += l.lx; mz += l.lz; my += l.sy;
    }
    const n = legs.length;
    mx /= n; mz /= n; my /= n;

    let sxx = 0, szz = 0, sxz = 0, sxy = 0, szy = 0;
    for (const l of legs) {
      const ax = l.lx - mx, az = l.lz - mz, ay = l.sy - my;
      sxx += ax * ax; szz += az * az; sxz += ax * az; sxy += ax * ay; szy += az * ay;
    }
    const eps = 0.05;                                  // keeps it stable when feet line up (like two legs)
    const det = (sxx + eps) * (szz + eps) - sxz * sxz;
    let A = (sxy * (szz + eps) - sxz * szy) / det;     // slope of the ground sideways
    let B = ((sxx + eps) * szy - sxz * sxy) / det;     // slope of the ground front to back
    this._planeY = my - A * mx - B * mz;               // ground height right under the body's center

    A *= this.gait.tilt; B *= this.gait.tilt;
    const slope = Math.hypot(A, B), maxSlope = 0.65;   // don't lean past about 33 degrees
    if (slope > maxSlope) { A *= maxSlope / slope; B *= maxSlope / slope; }

    this.tiltA = this._tA.update(A, dt, 6);            // glide toward the new lean, don't snap
    this.tiltB = this._tB.update(B, dt, 6);

    // Lean into turns, like a bike
    // Weight shift: when the feet on one side lift, the body leans toward the side still standing
    let leftDown = 0, leftN = 0, rightDown = 0, rightN = 0;
    for (const l of legs) {
      if (l.side > 0) { leftN++; if (!l.stepping) leftDown++; }
      else { rightN++; if (!l.stepping) rightDown++; }
    }
    const sway = (rightN ? rightDown / rightN : 0.5) - (leftN ? leftDown / leftN : 0.5);   // +1 when only the right feet are down
    const gaitAmount = Math.min(1, Math.abs(this.speed) / this.maxSpeed * 3);
    const bankTarget = -Math.max(-1, Math.min(1, this._yawRate / 1.6)) * (this.speed / this.maxSpeed) * 0.15 + 0.06 * sway * gaitAmount;
    this.bank = this._bk.update(bankTarget, dt, 6);

    T.n.set(-this.tiltA, 1, -this.tiltB).normalize();  // which way is "up" for the tilted body
    this._qTilt.setFromUnitVectors(UP, T.n);
    this._qBank.setFromAxisAngle(AXIS_Z, this.bank);
    this.q.setFromAxisAngle(UP, this.yaw).multiply(this._qTilt).multiply(this._qBank);
  }

  // ---- GAIT ------------------------------------------------------------
  // A gait is WHEN each foot swings. Real animals use a few patterns, and they
  // are all the same recipe with different numbers:
  //   - A gait clock ticks around from 0 to 1. Each leg has an offset, so it
  //     swings when the clock reaches its own point in the cycle.
  //   - Left and right legs are half a cycle apart (they alternate).
  //   - Down the body, each leg is a bit later than the one behind it, by
  //     `delta` of a cycle. A small delta gives a slow WAVE ripple (rear to
  //     front), a delta of 0.5 gives the fast alternating pattern.
  //   - `sigma` is the fraction of the cycle a foot spends in the air.
  // Quadruped: walk (legs lift one at a time) then trot (diagonal pairs).
  // Six legs: wave, then tripod. Eight legs: wave, then alternating tetrapod.
  // Two legs: walk, then jog. Odd counts work too: just a lopsided wave.
  // The creature switches from the slow gait to the fast one by itself when
  // the slow one can no longer keep up.
  _buildGait() {
    const legs = this.legs, L = this.avgLeg;
    const leftCount = legs.filter(l => l.side > 0).length;
    const m = Math.max(1, leftCount, legs.length - leftCount);   // legs per side

    // Each leg's spot along the body, counted in "rows" from the rear (can be a fraction)
    const zs = [...new Set(legs.map(l => l.hipZ.toFixed(3)))].map(Number).sort((a, b) => a - b);
    const gaps = [];
    for (let i = 1; i < zs.length; i++) gaps.push(zs[i] - zs[i - 1]);
    gaps.sort((a, b) => a - b);
    const spacing = gaps.length ? gaps[Math.floor(gaps.length / 2)] : 1;
    legs.forEach((l, i) => {
      l.u = (l.hipZ - zs[0]) / spacing;
      l.jit = (((i * 7) % 5) - 2) * 0.006;           // a tiny difference per leg so it is not perfectly mechanical
      // Legs packed closely together (like a spider's) alternate reaching near and far, so
      // neighbors can swing past each other without their feet colliding.
      l.reachMul = spacing < 0.35 * L ? (Math.round(l.u) % 2 === 0 ? 0.72 : 1.28) : 1;
    });

    const slowDelta = 1 / (2 * m);
    // A lopsided body (different number of legs on each side) can't alternate in clean pairs,
    // so its "fast" gait is a quicker wave instead of a trot.
    const symmetric = leftCount === legs.length - leftCount;
    const fastDelta = symmetric ? 0.5 : Math.max(slowDelta, 1 / m);
    const gi = this._gait = {
      m, symmetric,
      deltaSlow: slowDelta, sigmaSlow: Math.min(slowDelta, 0.4),
      deltaFast: fastDelta, sigmaFast: symmetric ? (m === 1 ? 0.46 : 0.5) : Math.min(fastDelta, 0.4),
      swing: Math.max(0.18, Math.min(0.5, 0.26 * Math.pow(L, 0.4))),   // seconds a foot is in the air (bigger legs, slower swings)
    };
    // The fastest each gait can go: the body travels while a foot is planted, and that
    // distance must stay within what the leg can reach (about half a leg length).
    // Legs packed close together also limit speed: a foot should not travel much farther than the gap to its neighbor.
    this._capOf = (sigma, swing) => Math.min(
      0.5 * L * sigma / ((1 - sigma) * swing),
      m > 1 ? 0.9 * spacing * sigma / ((1 - sigma) * swing) : Infinity);
    gi.capSlow = this._capOf(gi.sigmaSlow, gi.swing);
    gi.capFast = this._capOf(gi.sigmaFast, gi.swing * 0.75);
    this.maxSpeed = Math.min(L * 1.1 * this.gait.speed, 0.9 * gi.capFast);
    this._turnRadius = legs.reduce((a, l) => a + Math.abs(l.hipX) + l.length * 0.45, 0) / legs.length;

    // Where the feet rest on average, in the body's own frame. The body hangs around that point.
    let sumX = 0, sumZ = 0;
    for (const l of legs) { sumX += l.hipX + l.side * l.length * 0.45 * l.reachMul; sumZ += l.hipZ; }
    this._restC = { x: sumX / legs.length, z: sumZ / legs.length };
    this._meanHipZ = sumZ / legs.length;

    this.gaitFast = false;
    this.delta = gi.deltaSlow;
    this.sigma = gi.sigmaSlow;
    this.clock = 0;
    this._tCyc = gi.swing / this.sigma;
    this._speedLimit = Infinity;
    this._moving = false;
    this.stats = { scheduled: 0, emergency: 0, tidy: 0 };   // how often each kind of step happened (for testing)
    for (const l of legs) {
      const offset = (l.side < 0 ? 0.5 : 0) + this.delta * l.u + l.jit;
      l.phase = ((-offset % 1) + 1) % 1;
      l.armed = false;                               // armed = "the clock says it is time to swing"
      l.armedTime = 0;
    }
  }

  gaitName() {
    if (!this._moving) return 'Standing';
    const m = this._gait.m, fast = this.gaitFast;
    if (!this._gait.symmetric) return fast ? 'Quick wave (lopsided)' : 'Wave (lopsided)';
    if (m === 1) return fast ? 'Jog' : 'Walk';
    if (m === 2) return fast ? 'Trot (diagonal pairs)' : 'Walk (one leg at a time)';
    if (m === 3) return fast ? 'Tripod' : 'Wave (ripple)';
    if (m === 4) return fast ? 'Alternating tetrapod' : 'Wave (ripple)';
    return fast ? 'Alternating gait' : 'Wave (ripple)';
  }

  // Tick the gait clock and arm each leg when its turn comes
  _updateGait(dt, vEff, moving) {
    const gi = this._gait;
    this._moving = moving;

    // Slow gait or fast gait? Switch when the slow one can no longer keep up (with a gap so it doesn't flicker)
    if (!this.gaitFast && vEff > 0.85 * gi.capSlow) this.gaitFast = true;
    else if (this.gaitFast && vEff < 0.6 * gi.capSlow) this.gaitFast = false;
    const k = Math.min(1, dt * 1.5);                   // blend between gaits over about a second
    this.delta += ((this.gaitFast ? gi.deltaFast : gi.deltaSlow) - this.delta) * k;
    this.sigma += ((this.gaitFast ? gi.sigmaFast : gi.sigmaSlow) - this.sigma) * k;

    // How long one full cycle takes. Faster walking means quicker swings and more steps per second.
    const swing = gi.swing * (1 - 0.25 * Math.min(1, vEff / this.maxSpeed));
    const cap = this._capOf(this.sigma, swing);
    const cadence = Math.max(0.35, Math.min(1, vEff / (0.8 * cap)));   // slow walkers step less often, so strides don't shrink to nothing
    this._tCyc = swing / this.sigma / cadence;
    this._speedLimit = 0.95 * cap;                     // the creature can't outrun the gait it is using (it speeds up as the faster gait takes over)

    const dClock = moving ? dt / this._tCyc : 0;       // standing still: the clock stops
    this.clock = (this.clock + dClock) % 1;
    for (const l of this.legs) {
      const offset = (l.side < 0 ? 0.5 : 0) + this.delta * l.u + l.jit;
      if (dClock > 0 && !l.stepping) {                 // ease the leg toward its place in the pattern
        let d = (this.clock - offset) - l.phase;
        d -= Math.round(d);
        l.phase += Math.max(-0.3 * dt, Math.min(0.3 * dt, d));
      }
      l.phase += dClock;
      if (l.phase >= 1) { l.phase -= 1; l.armed = true; l.armedTime = 0; }
      else if (l.phase < 0) l.phase += 1;
    }
  }

  // ---- STEPPING --------------------------------------------------------
  // Pick where a foot will land. We try a small grid of spots around the
  // ideal one and give each a "cost" (lower is better):
  //   - far from the ideal spot costs more
  //   - steep or bumpy ground, and spots near a cliff or box edge, cost more
  //   - spots the leg can barely reach cost more
  //   - spots on the wrong side of the body, too close to another foot, or that
  //     would put this foot in front of / behind a neighbor it should not pass
  //     cost a lot (that is what makes legs cross each other)
  // fx, fz, fyaw describe where the body will be when the foot lands.
  _chooseLanding(l, fx, fz, fyaw, lead, out) {
    const w = this.world, L = l.length, T = this._tmp;
    const s = Math.sin(fyaw), c = Math.cos(fyaw);
    const lx0 = l.hipX + l.side * L * 0.45 * l.reachMul, lz0 = l.hipZ + lead;     // the ideal spot, in the body's frame

    // Where the other feet are (or will land), in that same frame
    const others = [];
    for (const o of this.legs) {
      if (o === l) continue;
      const f = o.stepping ? o.to : o.pos;
      const dx = f.x - fx, dz = f.z - fz;
      others.push({ o, lx: dx * c - dz * s, lz: dx * s + dz * c });
    }

    // Where the hip will be when the foot lands (the body keeps moving while the foot swings)
    this._hipWorld(l, T.hip);
    const hipX = T.hip.x + (fx - this.goalPos.x), hipY = T.hip.y, hipZ = T.hip.z + (fz - this.goalPos.z);

    const restY = w.groundHeight(fx + lx0 * c + lz0 * s, fz - lx0 * s + lz0 * c);
    const step = L * 0.12, e = 0.3;
    let best = Infinity;
    for (let i = -2; i <= 2; i++) {
      for (let j = -2; j <= 2; j++) {
        const ox = i * step, oz = j * step;
        const lx = lx0 + ox, lz = lz0 + oz;
        const x = fx + lx * c + lz * s, z = fz - lx * s + lz * c;
        const y = w.groundHeight(x, z);

        let cost = Math.hypot(ox, oz) / L;                            // stay near the ideal spot
        const y1 = w.groundHeight(x + e, z), y2 = w.groundHeight(x - e, z);
        const y3 = w.groundHeight(x, z + e), y4 = w.groundHeight(x, z - e);
        const slope = Math.hypot(y1 - y2, y3 - y4) / (2 * e);
        const drop = Math.max(Math.abs(y1 - y), Math.abs(y2 - y), Math.abs(y3 - y), Math.abs(y4 - y));
        cost += Math.min(slope, 2) * 0.5;                              // prefer flatter ground
        if (drop > 0.35) cost += 1.5 + drop * 0.5;                     // avoid cliffs and box edges
        cost += Math.abs(y - restY) * 0.4;                             // prefer the same height as the ideal spot
        if (y > w.groundHeight(x, z, this.climbHeight) + 0.01) cost += 8;   // never land on a box too tall to climb

        const reach = Math.hypot(hipX - x, hipY - (y + l.footSize * 0.45), hipZ - z) / L;
        if (reach > 0.92) cost += (reach - 0.92) * 10;                 // avoid spots at the edge of reach

        const farEnough = Math.abs(l.hipX) + 0.15 * L;                 // stay on this leg's own side of the body
        if (lx * l.side < farEnough) cost += 6 + (farEnough - lx * l.side) * 10;

        for (const { o, lx: olx, lz: olz } of others) {
          const sep = (l.footSize + o.footSize) * 1.4;
          const d = Math.hypot(lx - olx, lz - olz);
          if (d < sep) cost += (sep - d) * 8;                          // do not stand on another foot
          if (o.side === l.side && o.hipZ !== l.hipZ && Math.abs(lx - olx) < sep) {                // keep the order of legs along the body
            const gap = Math.min(sep * 0.7, Math.abs(o.hipZ - l.hipZ) * 0.4);
            if (o.hipZ > l.hipZ && lz > olz - gap) cost += (lz - (olz - gap)) * 12;
            if (o.hipZ < l.hipZ && lz < olz + gap) cost += ((olz + gap) - lz) * 12;
          }
        }
        if (cost < best) { best = cost; out.set(x, y, z); }
      }
    }
    return out;
  }

  _startStep(l, moving) {
    const g = this.gait, T = this._tmp;
    // How long the swing takes: the gait clock decides (a standing creature just takes a normal step)
    const t0 = moving ? this.sigma * this._tCyc : this._gait.swing;

    // Pick the landing spot ONCE, for where the body will be when the foot lands.
    // (Aiming at a moving target every frame is what made feet jump around.)
    const futureYaw = this.goalYaw + this._yawRate * t0;
    const futureX = this.goalPos.x + Math.sin(this.goalYaw) * this.speed * t0;
    const futureZ = this.goalPos.z + Math.cos(this.goalYaw) * this.speed * t0;
    // Land a little AHEAD of the resting spot: as the body walks past, the foot ends up as far
    // behind as it started ahead, so the legs stay centered under the body instead of trailing.
    // While this foot is planted the body travels some distance. Land a bit ahead by half of it,
    // so the foot ends up as far behind the middle as it started ahead.
    const stanceTravel = Math.abs(this.speed) * (1 - this.sigma) * this._tCyc;
    const lead = moving ? Math.sign(this.speed) * Math.min(0.3 * l.length, stanceTravel * 0.5) : 0;
    this._chooseLanding(l, futureX, futureZ, futureYaw, lead, l.to);
    l.from.copy(l.pos);

    // Lift high enough to clear the highest ground along the way (like a box edge)
    const flat = Math.hypot(l.to.x - l.from.x, l.to.z - l.from.z);
    const rise = l.to.y - l.from.y;
    let top = Math.max(l.from.y, l.to.y);
    for (let i = 1; i < 6; i++) {
      const f = i / 6;
      top = Math.max(top, this.world.groundHeight(
        l.from.x + (l.to.x - l.from.x) * f, l.from.z + (l.to.z - l.from.z) * f));
    }
    l.arc = Math.max(l.length * g.stepHeight, top + 0.12 - (l.from.y + l.to.y) / 2);
    l.arc = Math.min(l.arc, 0.4 * l.length);          // never lift a foot right up beside its hip (the leg folds so tightly the knee can pop)

    // Never move a foot faster than a believable speed: long or high steps take longer
    const pathLength = flat + 2 * l.arc + Math.abs(rise);
    const footSpeedCap = Math.max(this.avgLeg * 3.2, Math.abs(this.speed) * 2.6);
    l.stepDur = Math.max(t0, pathLength / footSpeedCap);

    l.stepping = true;
    l.t = 0;
  }

  update(dt) {
    const g = this.gait, T = this._tmp, legs = this.legs;

    // 1. Move the DRIVER (the invisible intent pose) using what the controller asked for.
    //    It waits for the body, like a dog on a leash: if the body is too far behind it, or
    //    facing too far away from it, the driver slows down or stops turning.
    const L = this.avgLeg;
    // How far is the body behind (or off to the side of) the driver? Being AHEAD of it is fine.
    const gdx = this.goalPos.x - this.pos.x, gdz = this.goalPos.z - this.pos.z;
    const behind = gdx * Math.sin(this.goalYaw) + gdz * Math.cos(this.goalYaw);
    const aside = gdx * Math.cos(this.goalYaw) - gdz * Math.sin(this.goalYaw);
    const dist = Math.hypot(Math.max(0, behind), aside);
    const yawErr = Math.abs(wrapAngle(this.goalYaw - this.yaw));
    const leashPos = clamp01(1 - (dist - 0.3 * L) / (0.5 * L));          // some slack, then slow down
    const leashYaw = clamp01(1 - (yawErr - 0.35) / 0.6);                 // about 20 degrees of slack, then slow the turn
    const strainPace = this._strain > 1.15 ? Math.max(0.3, 1.15 / this._strain) : 1;   // hard ground: ease off
    const paceTarget = Math.min(strainPace, leashPos, 0.3 + 0.7 * leashYaw);
    this.pace = this._pace.update(paceTarget, dt, 6);
    const wantSpeed = this.fwd * this.maxSpeed * this.pace;
    const limitedSpeed = Math.max(-this._speedLimit, Math.min(this._speedLimit, wantSpeed));
    this.speed = this._sp.update(limitedSpeed, dt, 6);
    this._yawRate = this._yr.update(this.turn * 1.6 * Math.max(0.12, leashYaw), dt, 10);
    this.goalYaw += this._yawRate * dt;
    this.goalPos.x += Math.sin(this.goalYaw) * this.speed * dt;
    this.goalPos.z += Math.cos(this.goalYaw) * this.speed * dt;

    // 2. Place the visible body from the feet, then lean it to match the ground
    this._followFeet(dt);
    this._updateOrientation(dt);
    this._updateParts(dt);

    // 3. The gait clock decides when each foot should swing. On top of that, a foot
    //    steps early if its leg is over-stretched, and when standing still the
    //    feet tidy themselves into a neat stance.
    const vEff = Math.abs(this.speed) + Math.abs(this._yawRate) * this._turnRadius * 0.6;   // turning counts as moving
    const moving = vEff > 0.05;
    this._updateGait(dt, vEff, moving);

    let lifted = 0;
    for (const l of legs) if (l.stepping) lifted++;
    const maxLifted = Math.max(1, Math.floor(legs.length / 2));     // at least half the feet stay down
    const emergencyMax = Math.max(1, legs.length - 2);              // an over-stretched leg may step anyway
    const wants = [];
    let strain = 0;
    for (const l of legs) {
      if (l.stepping) continue;
      this._restFoot(l, this.goalPos.x, this.goalPos.z, this.goalYaw, 0, T.ideal);
      const lag = Math.hypot(T.ideal.x - l.pos.x, T.ideal.z - l.pos.z);
      this._hipWorld(l, T.hip);
      const stretch = Math.hypot(T.hip.x - l.pos.x, T.hip.y - (l.pos.y + l.footSize * 0.45), T.hip.z - l.pos.z) / l.length;
      strain = Math.max(strain, lag / (l.length * 0.45), (stretch - 0.72) / 0.22);
      if (stretch > 1.0 || lag > 0.6 * l.length) wants.push({ l, urgency: 100 + stretch, emergency: true });
      else if (l.armed && moving) { l.armedTime += dt; wants.push({ l, urgency: 10 + l.armedTime, emergency: false }); }
      else if (!moving && lag > 0.12 * l.length) wants.push({ l, urgency: lag / l.length, emergency: false });
    }
    this._strain = strain;                             // how far behind the feet are (used to set the pace)
    wants.sort((a, b) => b.urgency - a.urgency);
    for (const w of wants) {
      if (lifted >= (w.emergency ? emergencyMax : maxLifted)) continue;
      if (!w.emergency && w.l.neighbors.some(n => n.stepping && n.t < 0.75)) continue;   // don't lift beside a neighbor that has only just lifted
      if (w.emergency) this.stats.emergency++; else if (moving) this.stats.scheduled++; else this.stats.tidy++;
      this._startStep(w.l, moving);
      w.l.armed = false;
      lifted++;
    }
    if (!moving) for (const l of legs) l.armed = false;

    // 4. Move the feet
    for (const l of legs) {
      if (l.stepping) {
        l.t += dt / l.stepDur;
        const k = Math.min(l.t, 1);
        const e = smoother(k);                         // speed and acceleration both start and end at zero
        l.pos.x = l.from.x + (l.to.x - l.from.x) * e;
        l.pos.z = l.from.z + (l.to.z - l.from.z) * e;
        // Going up: rise early so the foot clears the edge. Going down: drop late.
        const ey = (l.to.y >= l.from.y) ? smoother(Math.min(1, k * 1.8)) : smoother(Math.max(0, (k - 0.45) / 0.55));
        // The lift is a bump that is flat at both ends (so the foot peels off and settles down gently, instead of
        // leaving the ground at full speed the way a plain sine curve does)
        l.pos.y = l.from.y + (l.to.y - l.from.y) * ey + 64 * k * k * k * (1 - k) * (1 - k) * (1 - k) * l.arc;
        if (l.t >= 1) { l.stepping = false; l.pos.copy(l.to); }
      } else {
        // A planted foot stays put, but follows the ground if the ground changes
        const gy = this.world.groundHeight(l.pos.x, l.pos.z);
        l.pos.y += (gy - l.pos.y) * Math.min(1, dt * 15);
      }
    }

    // 5. Body height
    // 5a. Where does it want to ride? A set height above the ground under the body.
    //     But never so high or low that a leg can't reach its foot.
    let lowest = -Infinity, highest = Infinity;
    for (const l of legs) {
      T.o.set(l.hipX, 0, l.hipZ).applyQuaternion(this.q);   // the hip's offset from the body center
      const sideways = Math.hypot(this.pos.x + T.o.x - l.pos.x, this.pos.z + T.o.z - l.pos.z);
      const reach = l.length * 0.96;
      const upDown = Math.sqrt(Math.max(0, reach * reach - sideways * sideways));   // how far up or down the leg can still reach
      const footY = l.pos.y + l.footSize * 0.45;
      lowest = Math.max(lowest, footY - upDown - T.o.y);
      highest = Math.min(highest, footY + upDown - T.o.y);
    }
    let targetY = this._planeY + this.standHeight;
    targetY = lowest > highest ? (lowest + highest) / 2 : Math.max(lowest, Math.min(highest, targetY));

    // 5b. Keep the body out of the ground: check the ground under and just
    //     ahead of the (tilted) body, and make sure its curved underside clears it.
    let hardFloor = -Infinity, softFloor = -Infinity;
    for (const part of this.parts) {                     // every segment of the body must clear the ground
      const halfW = part.width / 2, halfL = part.length / 2, halfH = part.height / 2;
      for (const [nx, nz, depth, hard, extra] of BODY_SAMPLES) {
        // that spot on the segment's underside, then follow the segment's swing and the body's tilt
        T.p.set(nx * (halfW + extra), part.y - halfH * depth, part.zc + nz * (halfL + extra))
          .applyMatrix4(part.mRel).applyQuaternion(this.q);
        const ground = this.world.groundHeight(this.pos.x + T.p.x, this.pos.z + T.p.z, this.climbHeight);
        const need = ground + 0.1 - T.p.y;              // how high the body center must be
        if (hard) hardFloor = Math.max(hardFloor, need);
        else softFloor = Math.max(softFloor, need);
      }
    }
    targetY = Math.max(targetY, softFloor, hardFloor);
    this.bodyY = this._ys.update(targetY, dt, 10);        // glide to the wanted height
    if (this.bodyY < hardFloor) {                         // ...but never sink into the ground
      this.bodyY = this._ys.x = hardFloor;
      if (this._ys.v < 0) this._ys.v = 0;
    }

    // 6. Place the shapes
    this.bodyGroup.position.set(this.pos.x, this.bodyY, this.pos.z);
    this.bodyGroup.quaternion.copy(this.q);
    for (const l of legs) this._solveLegIK(l, dt);
    this._separateLegs(dt);
    for (const l of legs) this._placeLeg(l, dt);
  }

  // Two-bone leg IK: the hip is on the body, the foot is on the ground, and
  // the leg has two equal bones. The knee sits halfway between them, pushed
  // out sideways by an amount we get from Pythagoras. Saves the three joints.
  _solveLegIK(l, dt) {
    const { hip, end, dir, pole, knee, v } = this._tmp;

    this._hipWorld(l, hip);
    const footLift = l.footSize * 0.45;
    end.set(l.pos.x, l.pos.y + footLift, l.pos.z);

    // A leg that is nearly straight makes its knee move extremely fast for tiny changes (a knee is
    // found with a square root, which is steepest right where the leg is fully straight), and the
    // knee would pop. So past 88% of its length the leg gives a little: it can get close to
    // straight, but never quite reaches it, and the knee moves smoothly the whole way.
    v.subVectors(end, hip);
    let dist = v.length();
    const soft = l.length * 0.88, room = l.length * 0.999 - soft;
    if (dist > soft) {
      const eased = soft + room * Math.tanh((dist - soft) / room);
      v.multiplyScalar(eased / dist);
      dist = eased;
      end.copy(hip).add(v);
    }
    dir.copy(v).divideScalar(dist);                  // direction from hip to foot

    // Knees bend outward and up (relative to the tilted body), like a spider. Mostly outward: if the
    // knee direction were mostly "up", a leg pointing straight down would flip it back and forth
    // (the two are opposite, so which way to bulge is undecided). Outward is never opposite to a downward leg.
    pole.set(l.side * 1.0, 0.8, 0).applyQuaternion(this.q).normalize();
    // If the leg points almost along that direction (a foot lifted up and out), "bend perpendicular to
    // the leg" becomes unstable. Blend toward a different direction (forward) so the knee swings smoothly past.
    const w = smooth01(Math.max(0, Math.min(1, (Math.abs(pole.dot(dir)) - 0.65) / 0.3)));
    if (w > 0) pole.lerp(v.set(0, 0, 1).applyQuaternion(this.q), w);
    pole.addScaledVector(dir, -pole.dot(dir)).normalize();
    l.poleS.lerp(pole, Math.min(1, dt * 20));        // ease the knee direction so it never flicks suddenly
    l.poleS.addScaledVector(dir, -l.poleS.dot(dir));
    if (l.poleS.lengthSq() < 1e-6) l.poleS.copy(pole);
    pole.copy(l.poleS).normalize();

    const half = l.length / 2;
    const a = dist / 2;
    const h = Math.sqrt(Math.max(0, half * half - a * a));
    knee.copy(hip).addScaledVector(dir, a).addScaledVector(pole, h);

    l.hipP.copy(hip); l.kneeP.copy(knee); l.endP.copy(end);
  }

  // Last safety net: if two neighboring legs would pass through each other, push
  // their knees apart. (Choosing good landing spots already prevents most of this.)
  _separateLegs(dt) {
    const legs = this.legs, res = this._seg;
    // 1. Smooth the knee that the leg's own shape asks for. A knee may only change its speed so fast,
    //    so if the geometry ever demands a sudden jump (a foot lifted right beside its hip can do that)
    //    the knee glides there over a few frames instead of popping.
    for (const l of legs) {
      if (!l.kneeReady) { l.kneePrev.copy(l.kneeP); l.kneeVel.set(0, 0, 0); l.kneeReady = true; }
      const want = this._tmp.o.copy(l.kneeP).sub(l.kneePrev).addScaledVector(l.kneeVel, -dt);   // how far from where it was heading
      const maxStep = KNEE_MAX_ACCEL * dt * dt;
      if (want.length() > maxStep) want.setLength(maxStep);
      l.kneeP.copy(l.kneePrev).addScaledVector(l.kneeVel, dt).add(want);
      l.kneeVel.copy(l.kneeP).sub(l.kneePrev).divideScalar(dt);
      l.kneePrev.copy(l.kneeP);
      l.kneeBase.copy(l.kneeP);                           // where the knee is before the keep-apart pass
    }
    // 2. Then keep neighboring legs apart. This pass works right away (an easing delay would let legs overlap).
    //    It starts from the push of the previous frame (which fades a little each frame unless it is still
    //    needed). Without that, a push could switch on and off every other frame and the knee would flutter.
    const fade = Math.exp(-dt * 6);
    for (const l of legs) l.kneeP.copy(l.kneeBase).addScaledVector(l.kneeOff, fade);
    for (let pass = 0; pass < 2; pass++) {
      for (let i = 0; i < legs.length; i++) {
        const a = legs[i];
        for (const b of a.neighbors) {
          if (legs.indexOf(b) < i) continue;                // check each pair once
          const minDist = a.thickness + b.thickness + 0.04;
          for (let sa = 0; sa < 2; sa++) {                   // sa: 0 = upper bone, 1 = lower bone
            for (let sb = 0; sb < 2; sb++) {
              segSegClosest(sa === 0 ? a.hipP : a.kneeP, sa === 0 ? a.kneeP : a.endP,
                            sb === 0 ? b.hipP : b.kneeP, sb === 0 ? b.kneeP : b.endP, res);
              if (res.dist >= minDist) continue;
              if (res.dist > 1e-5) res.dir.divideScalar(res.dist);
              else res.dir.subVectors(a.hipP, b.hipP).add(UP).normalize();
              const push = (minDist - res.dist) * 0.5;
              // Only the knee can move (hip and foot are fixed), so it has to move more
              // than the spot where the legs touch.
              const wa = sa === 0 ? res.s : 1 - res.s, wb = sb === 0 ? res.t : 1 - res.t;
              const cap = 0.3 * Math.min(a.length, b.length);
              a.kneeP.addScaledVector(res.dir, Math.min(cap, push / Math.max(wa, 0.35)));
              b.kneeP.addScaledVector(res.dir, -Math.min(cap, push / Math.max(wb, 0.35)));
            }
          }
        }
      }
    }
    for (const l of legs) l.kneeOff.copy(l.kneeP).sub(l.kneeBase);   // remember this frame's push for the next frame

  }

  // Put the leg's shapes where its joints are
  _placeLeg(l, dt) {
    const n = this._tmp.n;
    l.hipJoint.position.copy(l.hipP);
    l.hipJoint.scale.setScalar(l.thickness * 1.3);
    this._placeLimb(l.upper, l.hipP, l.kneeP, l.thickness);
    this._placeLimb(l.lower, l.kneeP, l.endP, l.thickness * 0.8);
    l.knee.position.copy(l.kneeP);
    l.knee.scale.setScalar(l.thickness * 1.1);

    // The foot lies flat on the slope it stands on (and levels out while in the air)
    n.set(0, 1, 0);
    if (!l.stepping) {
      const e = 0.25, w = this.world;
      const gx = (w.groundHeight(l.pos.x + e, l.pos.z) - w.groundHeight(l.pos.x - e, l.pos.z)) / (2 * e);
      const gz = (w.groundHeight(l.pos.x, l.pos.z + e) - w.groundHeight(l.pos.x, l.pos.z - e)) / (2 * e);
      const slope = Math.hypot(gx, gz);
      if (slope < 1.5) {                               // a very steep "slope" is really a box edge, so ignore it
        const k = slope > 0.8 ? 0.8 / slope : 1;
        n.set(-gx * k, 1, -gz * k).normalize();
      }
    }
    l.nrm.lerp(n, Math.min(1, dt * 12)).normalize();
    this._qFoot.setFromUnitVectors(UP, l.nrm);
    l.foot.position.copy(l.endP);                      // the foot rides at the end of the leg
    l.foot.scale.set(l.footSize, l.footSize * 0.5, l.footSize * 1.3);
    l.foot.quaternion.setFromAxisAngle(UP, this.yaw).premultiply(this._qFoot);
  }

  // Stretch a unit cylinder so it runs from point a to point b
  _placeLimb(mesh, a, b, thickness) {
    const v = this._tmp.v;
    v.subVectors(b, a);
    const len = v.length();
    if (len < 1e-5) return;
    mesh.position.copy(a).addScaledVector(v, 0.5);
    mesh.scale.set(thickness, len, thickness);
    mesh.quaternion.setFromUnitVectors(UP, v.divideScalar(len));
  }

  dispose() {
    scene.remove(this.root);
    for (const m of this.bodyMats) m.dispose();
  }
}

// ---- A quick way to make specs from a few numbers --------------------
// Legs come in left/right pairs spread along the body. An odd number of legs
// just leaves the last pair with one leg, which makes a lopsided creature.
// How a body of 1 to 4 segments is shaped, from front to rear. len is each segment's share of the
// length, w and h are its width and height compared with the biggest segment, and legs says where
// the legs grow. (Like an insect: head, thorax with the legs, abdomen.)
const BODY_PATTERNS = {
  1: [{ len: 1, w: 1, h: 1, legs: true }],
  2: [{ len: 0.62, w: 0.8, h: 0.85, legs: true }, { len: 0.38, w: 1, h: 1 }],
  3: [{ len: 0.16, w: 0.55, h: 0.6 }, { len: 0.54, w: 0.85, h: 0.85, legs: true }, { len: 0.3, w: 1, h: 1 }],
  4: [{ len: 0.14, w: 0.5, h: 0.55 }, { len: 0.3, w: 0.8, h: 0.8, legs: true }, { len: 0.3, w: 0.85, h: 0.85, legs: true }, { len: 0.26, w: 1, h: 1 }],
};

function specFromParams(p) {
  // The body: scale the pattern to the requested length (segments overlap a little, so allow for that)
  const pattern = BODY_PATTERNS[p.bodySegments] || BODY_PATTERNS[1];
  let overlaps = 0;
  for (let i = 1; i < pattern.length; i++) overlaps += 0.4 * Math.min(pattern[i - 1].len, pattern[i].len);
  const scale = p.bodyLength / (pattern.reduce((s, q) => s + q.len, 0) - overlaps);
  const mix = (v) => 1 + (v - 1) * p.segmentContrast;              // contrast 0 = all segments the same size
  const segments = pattern.map(q => ({
    length: q.len * scale, width: p.bodyWidth * mix(q.w), height: p.bodyHeight * mix(q.h), legs: !!q.legs }));
  const layout = layoutBodyParts({ segments });

  // The legs are spread along the segments that carry them
  const carriers = layout.parts.filter(q => q.legs);
  const zMax = Math.max(...carriers.map(q => q.zc + q.length / 2));
  const zMin = Math.min(...carriers.map(q => q.zc - q.length / 2));
  const zoneMid = (zMax + zMin) / 2, zoneHalf = (zMax - zMin) / 2;

  const rows = Math.ceil(p.legs / 2);
  const legs = [];
  for (let i = 0; i < p.legs; i++) {
    const side = (i % 2 === 0) ? 1 : -1;
    const row = Math.floor(i / 2);
    const z = (rows === 1) ? zoneMid : zoneMid + zoneHalf * 0.8 * (1 - 2 * row / (rows - 1));
    legs.push({ hipX: side, hipZ: z, length: p.legLength, thickness: p.thickness, footSize: p.footSize });
  }
  return {
    body: { length: layout.length, width: p.bodyWidth, height: p.bodyHeight, segments },
    legs,
    gait: { stepHeight: p.stepHeight, tilt: p.tilt, speed: p.speed, flex: p.bodyFlex },
  };
}

// ---- A controller: this one makes the creature wander around ----------
// The creature never decides where to walk. It only follows fwd/turn.
// Anything can set those: this wander code, the keyboard, or later an AI.
const wander = { x: 0, z: 0, timer: 0 };

function pickWaypoint(c) {
  for (let i = 0; i < 30; i++) {
    const x = (Math.random() * 2 - 1) * 20, z = (Math.random() * 2 - 1) * 20;
    const clear = boxes.every(b => b.height <= c.climbHeight || Math.abs(x - b.x) > b.half + c.radius + 1 || Math.abs(z - b.z) > b.half + c.radius + 1);
    if (clear) { wander.x = x; wander.z = z; break; }
  }
  wander.timer = 8;                      // give up on a target after 8 seconds
}

function steerWander(c, dt) {
  wander.timer -= dt;
  let dx = wander.x - c.goalPos.x, dz = wander.z - c.goalPos.z;
  if (Math.hypot(dx, dz) < 1.5 || wander.timer <= 0) { pickWaypoint(c); dx = wander.x - c.goalPos.x; dz = wander.z - c.goalPos.z; }

  // Head for the target, but get nudged away from boxes it can't climb and from the edge
  const dist = Math.hypot(dx, dz) || 1;
  let dirX = dx / dist, dirZ = dz / dist;
  for (const b of boxes) {
    if (b.height <= c.climbHeight) continue;
    const bx = c.goalPos.x - b.x, bz = c.goalPos.z - b.z;
    const d = Math.hypot(bx, bz) || 0.01;
    const range = b.half * 1.5 + c.radius + 2.5;
    if (d < range) {
      const push = (1 - d / range) * 2.5;
      dirX += (bx / d) * push;
      dirZ += (bz / d) * push;
    }
  }
  const edge = LIMIT - 4;
  if (Math.abs(c.goalPos.x) > edge) dirX -= Math.sign(c.goalPos.x) * 1.5;
  if (Math.abs(c.goalPos.z) > edge) dirZ -= Math.sign(c.goalPos.z) * 1.5;

  let diff = Math.atan2(dirX, dirZ) - c.goalYaw;       // how far to turn to face that way
  diff = Math.atan2(Math.sin(diff), Math.cos(diff));   // wrap into -180..180 degrees
  c.turn = Math.max(-1, Math.min(1, diff * 1.5));
  c.fwd = Math.abs(diff) < 1.0 ? 1 : 0.25;         // slow down for sharp turns
}

// Drive the creature with the keyboard. The keys are relative to the view, so
// W walks it away from the camera. Same fwd/turn controls the wander code uses.
function steerByKeys(c) {
  const m = readMoveInput(viewHeading());
  if (m.x === 0 && m.z === 0) { c.fwd = 0; c.turn = 0; return; }
  let diff = Math.atan2(m.x, m.z) - c.goalYaw;         // how far to turn to face the wanted direction
  diff = Math.atan2(Math.sin(diff), Math.cos(diff));
  c.turn = Math.max(-1, Math.min(1, diff * 3));
  c.fwd = Math.abs(diff) < 1.2 ? 1 : 0.15;
}

// Keep creatures out of boxes and on the floor
function keepCreatureInWorld(c) {
  const startX = c.pos.x, startZ = c.pos.z;
  for (const b of boxes) {
    if (b.height <= c.climbHeight) continue;       // low enough to climb, so it is not a wall
    const dx = c.pos.x - b.x, dz = c.pos.z - b.z;
    const limit = b.half + c.radius;
    if (Math.abs(dx) < limit && Math.abs(dz) < limit) {
      if (limit - Math.abs(dx) < limit - Math.abs(dz)) c.pos.x = b.x + Math.sign(dx || 1) * limit;
      else c.pos.z = b.z + Math.sign(dz || 1) * limit;
    }
  }
  const edge = LIMIT - 1;
  c.pos.x = Math.max(-edge, Math.min(edge, c.pos.x));
  c.pos.z = Math.max(-edge, Math.min(edge, c.pos.z));
  // Only do part of the push each frame. A full push would make the body jump sideways; this slides it out.
  c.pos.x = startX + (c.pos.x - startX) * 0.4;
  c.pos.z = startZ + (c.pos.z - startZ) * 0.4;
  c._px.x = c.pos.x; c._pz.x = c.pos.z;           // keep the body's springs in step
  c.goalPos.x += c.pos.x - startX;                 // the driver gets pushed along with the body
  c.goalPos.z += c.pos.z - startZ;
}

// =====================================================================
// PART D: THE CREATURE PANEL (sliders and presets)
