// =====================================================================
const params = { legs: 4, legLength: 2.0, thickness: 0.12, bodyLength: 2.0, bodyWidth: 1.2, bodyHeight: 0.9, footSize: 0.25,
                 stepHeight: 0.18, tilt: 0.8, speed: 1, bodySegments: 1, segmentContrast: 0.7, bodyFlex: 0.6 };

// [setting, label, min, max, step]
const sliderDefs = [
  ['legs',       'Legs',          2,    8,   1],
  ['legLength',  'Leg length',    0.8,  3.5, 0.1],
  ['thickness',  'Leg thickness', 0.04, 0.3, 0.01],
  ['bodyLength', 'Body length',   1,    4,   0.1],
  ['bodyWidth',  'Body width',    0.6,  3,   0.1],
  ['bodyHeight', 'Body height',   0.4,  2,   0.1],
  ['footSize',   'Foot size',     0.1,  0.6, 0.02],
  ['stepHeight', 'Step height',   0.05, 0.4, 0.01],
  ['tilt',       'Body tilt',     0,    1,   0.05],
  ['speed',      'Walk speed',    0.5,  2,   0.1],
  ['bodySegments',   'Body segments',   1, 4, 1],
  ['segmentContrast', 'Segment contrast', 0, 1, 0.05],
  ['bodyFlex',       'Body flex',       0, 1, 0.05],
];

const presets = {
  'Spider (8)':  { legs: 8, legLength: 2.2, thickness: 0.10, bodyLength: 2.6, bodyWidth: 1.4, bodyHeight: 0.8, footSize: 0.20, bodySegments: 2, segmentContrast: 0.8, bodyFlex: 0.7 },
  'Dog (4)':     { legs: 4, legLength: 1.6, thickness: 0.16, bodyLength: 3.0, bodyWidth: 1.0, bodyHeight: 1.0, footSize: 0.25, bodySegments: 1, segmentContrast: 0.7, bodyFlex: 0.6 },
  'Beetle (6)':  { legs: 6, legLength: 1.4, thickness: 0.10, bodyLength: 3.2, bodyWidth: 1.2, bodyHeight: 0.7, footSize: 0.20, bodySegments: 3, segmentContrast: 0.7, bodyFlex: 0.5 },
  'Bird (2)':    { legs: 2, legLength: 2.4, thickness: 0.14, bodyLength: 1.2, bodyWidth: 1.2, bodyHeight: 1.4, footSize: 0.35, bodySegments: 1, segmentContrast: 0.7, bodyFlex: 0.6 },
  'Oddball (5)': { legs: 5, legLength: 2.0, thickness: 0.12, bodyLength: 3.4, bodyWidth: 1.6, bodyHeight: 1.0, footSize: 0.25, bodySegments: 3, segmentContrast: 0.6, bodyFlex: 0.6 },
  'Stilts (4)':  { legs: 4, legLength: 3.5, thickness: 0.20, bodyLength: 2.6, bodyWidth: 1.2, bodyHeight: 1.2, footSize: 0.40, bodySegments: 1, segmentContrast: 0.7, bodyFlex: 0.6 },
};

let creature = null;
function respawnCreature() {
  let x = -4, z = 12, yawNow = 0;
  if (creature) { x = creature.pos.x; z = creature.pos.z; yawNow = creature.yaw; creature.dispose(); }
  creature = new Creature(specFromParams(params), world, x, z, yawNow);
  wander.timer = 0;                      // pick a fresh target
}

const sliderRefs = {};
const slidersDiv = document.getElementById('sliders');
for (const [key, label, min, max, step] of sliderDefs) {
  const row = document.createElement('label');
  row.className = 'row';
  row.innerHTML = '<span>' + label + ' <b></b></span><input type="range">';
  const input = row.querySelector('input');
  const value = row.querySelector('b');
  input.min = min; input.max = max; input.step = step;
  input.addEventListener('input', () => {
    params[key] = Number(input.value);
    value.textContent = params[key];
    respawnCreature();
  });
  input.addEventListener('change', () => input.blur());    // so W A S D keep working afterwards
  sliderRefs[key] = { input, value };
  slidersDiv.appendChild(row);
}
function refreshSliders() {
  for (const key in sliderRefs) {
    sliderRefs[key].input.value = params[key];
    sliderRefs[key].value.textContent = params[key];
  }
}

const presetsDiv = document.getElementById('presets');
for (const name in presets) {
  const btn = document.createElement('button');
  btn.textContent = name;
  btn.addEventListener('click', () => {
    Object.assign(params, presets[name]);
    refreshSliders();
    respawnCreature();
    btn.blur();
  });
  presetsDiv.appendChild(btn);
}
document.getElementById('wander').addEventListener('change', e => e.target.blur());

// Terrain roughness slider
(function buildTerrainSlider() {
  const row = document.createElement('label');
  row.className = 'row';
  row.innerHTML = '<span>Roughness <b></b></span><input type="range" min="0" max="2" step="0.1">';
  const input = row.querySelector('input'), value = row.querySelector('b');
  input.value = roughness;
  value.textContent = roughness;
  input.addEventListener('input', () => {
    roughness = Number(input.value);
    value.textContent = roughness;
    rebuildTerrain();
  });
  input.addEventListener('change', () => input.blur());
  document.getElementById('terrainBox').appendChild(row);
})();

// =====================================================================
// PART E: THE MAIN LOOP
// =====================================================================
const clock = new THREE.Clock();
const gaitEl = document.getElementById('gaitInfo');
let lastGaitText = '';

// One small step of the simulation: you, then the creature
function simStep(dt) {
  updatePlayer(dt);

  if (controlCreature) steerByKeys(creature);
  else if (document.getElementById('wander').checked) steerWander(creature, dt);
  else { creature.fwd = 0; creature.turn = 0; }
  creature.update(dt);
  keepCreatureInWorld(creature);
}

function animate() {
  requestAnimationFrame(animate);
  const frameDt = Math.min(clock.getDelta(), 0.1);   // cap it so a lag spike can't break the physics

  // Split each frame into equal steps of at most 1/120 s. Small steps keep the physics stable, and equal
  // ones that add up to exactly the frame time keep the motion even whatever the screen's refresh rate.
  const steps = Math.max(1, Math.ceil(frameDt / (1 / 120)));
  for (let i = 0; i < steps; i++) simStep(frameDt / steps);

  const gaitText = 'Gait: ' + creature.gaitName();
  if (gaitText !== lastGaitText) { gaitEl.textContent = gaitText; lastGaitText = gaitText; }

  placeCamera(frameDt);
  renderer.render(scene, camera);
}

refreshSliders();
respawnCreature();
setCamMode('observe');
setControl(false);
animate();
</script>
